name: Auto-merge label

# Adding the `auto-merge` label to a pull request turns on GitHub's auto-merge
# for it; removing the label turns it off. The merge still waits for everything
# the ruleset on main requires (the `CI` check, and any approvals), so the label
# only says "merge this when it is ready".
#
# Only people with triage access or above can label a pull request, which is
# what makes the label a safe switch. It runs on pull_request_target so a label
# on a pull request from a fork works too; that is safe here because this job
# never checks out or runs anything from the pull request — it only calls the
# GitHub API about it. Keep it that way: do not add a checkout step.
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge label
    if: github.event.label.name == 'auto-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Enable auto-merge
        if: github.event.action == 'labeled' && !github.event.pull_request.draft
        run: gh pr merge "$PR" --auto --merge

      - name: Disable auto-merge
        if: github.event.action == 'unlabeled'
        run: gh pr merge "$PR" --disable-auto
