<!-- yootri "y" mark — Nocturne tokens (bg #161826, accent-900 bloom, accent-300 glyph).
     Vector twin of favicon.ico: modern browsers prefer this over the .ico, so the two
     must always depict the same mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="yootri">
  <title>yootri</title>
  <defs>
    <!-- Nocturne "lit ground": accent-tinted bloom off the top-right corner -->
    <radialGradient id="y-bloom" cx="0.88" cy="0.06" r="0.95">
      <stop offset="0" stop-color="#2b2741"/>
      <stop offset="0.62" stop-color="#2b2741" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#161826"/>
  <rect width="64" height="64" rx="14" fill="url(#y-bloom)"/>
  <g fill="none" stroke="#d2cefd" stroke-width="6.5" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M19 17 L33 40"/>
    <path d="M45 17 L24.5 55"/>
  </g>
</svg>
