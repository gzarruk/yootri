[project]
name = "yootri-garmin-bridge"
version = "0.1.0"
description = "A personal, local bridge from Garmin Connect to the yootri planner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["garminconnect==0.3.16"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
